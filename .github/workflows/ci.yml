name: hybrid-os-v0.15.0
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boot-smoke-test:
    name: Build and test Memory Core, GDT/TSS/IST, task lifecycle, blocking/wakeup, timers, timeouts, semaphores, IPC services, request/response protocol, pending-call runtime, concurrent replies, service lifecycle, queue backpressure, delivery receipts, ACK, timer-driven retry, deadlines and dead-letter queue in QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils git curl xorriso qemu-system-x86
      - name: Build ISO and run kernel regression tests
        run: make test
      - name: Upload kernel and ISO
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: hybrid-os-v0.15.0
          path: |
            build/kernel.elf
            build/hybrid.iso
            build/qemu-serial.log
            build/qemu-debug.log
          if-no-files-found: error
          retention-days: 14
